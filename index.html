<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leien — Construire des histoires</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:Verdana,Geneva,sans-serif; background:#f4f4f2; color:#222; }
  .page { max-width:1450px; margin:0 auto; padding:24px; }
  header { text-align:center; margin-bottom:18px; }
  h1 { margin:0; font-size:32px; }
  .subtitle { margin-top:4px; font-size:16px; }
  .selector { margin:18px auto 20px; display:flex; justify-content:center; align-items:center; gap:10px; }
  select { font:inherit; padding:8px 10px; min-width:260px; }
  .work-area { display:grid; grid-template-columns:minmax(0,4fr) minmax(220px,1fr); gap:18px; align-items:start; }
  .structure,.toolbox { background:white; border:1px solid #cfcfcf; border-radius:8px; }
  .structure { overflow:hidden; }
  .step { display:grid; grid-template-columns:minmax(185px,27%) minmax(0,73%); min-height:145px; border-bottom:1px solid #ddd; }
  .step:last-child { border-bottom:0; }
  .step-info { padding:13px 15px; border-right:1px solid #ddd; }
  .step-number { font-size:12px; font-weight:bold; }
  .step-title { font-size:16px; font-weight:bold; margin:2px 0 9px; }
  .step-desc { font-size:11px; line-height:1.35; }
  .writing { position:relative; padding:10px; }
  textarea { width:100%; height:100%; min-height:122px; resize:none; overflow:hidden; border:1px solid #aaa; border-radius:5px; padding:10px 10px 24px; font:11.5px/1.35 Verdana,Geneva,sans-serif; color:#222; background:#fff; }
  .counter { position:absolute; right:18px; bottom:17px; font-size:9px; color:#777; pointer-events:none; background:white; padding-left:3px; }
  .toolbox { padding:14px; position:sticky; top:12px; }
  .toolbox h2 { margin:0 0 14px; font-size:17px; }
  .tool { padding:11px 0; border-top:1px solid #ddd; }
  .tool:first-of-type { border-top:0; }
  .tool-name { font-size:13px; font-weight:bold; margin-bottom:6px; }
  .idea { min-height:18px; font-size:11px; line-height:1.35; margin-bottom:7px; }
  button { font:11px Verdana,Geneva,sans-serif; padding:6px 8px; border:1px solid #aaa; border-radius:5px; background:#f7f7f7; cursor:pointer; }
  button:hover { background:#eee; }
  .full-draw { width:100%; margin-top:10px; padding:8px; }
  .actions { margin:16px 0; display:flex; justify-content:center; }
  .print-btn { font-size:12px; padding:9px 14px; }
  footer { text-align:center; font-size:10px; color:#666; margin-top:10px; }
  @media (max-width:700px) { .work-area { grid-template-columns:1fr; } .toolbox { position:static; } }
  @media print {
    @page { size:A4 landscape; margin:10mm; }
    body { background:white; }
    .page { max-width:none; padding:0; }
    header { margin-bottom:5mm; }
    h1 { display:none; }
    .subtitle { font-size:10pt; }
    .subtitle { font-size:0; }
    .subtitle::after { content:"Mon histoire"; font-size:10pt; }
    header { margin-bottom:1mm; }
    .selector,.toolbox,.actions { display:none; }
    .work-area { display:block; }
    .structure { border:1px solid #888; border-radius:0; }
    .step { min-height:0; height:29mm; grid-template-columns:27% 73%; }
    .step-info { padding:2.5mm 3mm; }
    .step-number { font-size:7pt; }
    .step-title { font-size:9pt; margin:1px 0 2px; }
    .step-desc { font-size:6.5pt; line-height:1.25; }
    .writing { padding:2mm; }
    textarea { min-height:0; height:24mm; font-size:7.5pt; line-height:1.25; padding:2mm 2.5mm 5mm; border-color:#999; }
    .counter { font-size:6.5pt; right:3.5mm; bottom:3.5mm; }
    footer { margin-top:2mm; font-size:7pt; }
  }
</style>
</head>
<body>
<div class="page">
<header><h1>Leien</h1><div class="subtitle">Construire des histoires</div></header>
<div class="selector"><label for="structure">Choisir une structure de récit</label><select id="structure">
<option value="">Choisir une structure de récit</option><option value="obstacle">L’Obstacle</option><option value="mystere">Le Mystère</option><option value="catastrophe">La Catastrophe</option><option value="dilemme">Le Dilemme</option>
</select></div>
<main class="work-area"><section class="structure" id="structureBox"></section><aside class="toolbox"><h2>Boîte à outils</h2><div id="tools"></div><button class="full-draw" id="fullDraw">🎲 Tirage complet</button></aside></main>
<div class="actions"><button type="button" class="print-btn" id="printBtn">📄 Imprimer / enregistrer en PDF</button></div>
<footer>Pierre Lemétayer – 2026</footer>
</div>
<script>
const genericAnchor="Le personnage principal dans son quotidien. Une petite scène qui illustre une qualité ou un défaut, et/ou l'attachement à un objet, une personne ou un lieu.";
const structures={
obstacle:[
["Le Cadre","Où ? Quand ? Qui ? Descriptions.","Installer le lieu, le moment, les personnages et les éléments importants du décor."],
["L’Ancrage","",genericAnchor],["Le Bouleversement","","Un événement bouleverse la situation et fait apparaître un obstacle."],
["Les Difficultés","","Le personnage tente de surmonter l'obstacle, mais ses actions échouent ou ne suffisent pas."],
["La Résolution","","Une action, une idée, une rencontre, une découverte ou une aide permet de surmonter l'obstacle."],
["Le Nouvel équilibre","","Le problème est résolu et une nouvelle situation s'installe, éventuellement différente de la situation initiale."]],
mystere:[
["Le Cadre","Où ? Quand ? Qui ? Descriptions.","Installer le lieu, le moment, les personnages et les éléments importants du décor."],
["L’Ancrage","",genericAnchor],["L’Anomalie","","Un événement, un objet ou un détail étrange vient troubler la situation. Quelque chose ne semble pas être ce qu'il devrait être."],
["La Recherche","","Le personnage cherche à comprendre ce qui s'est passé. Il recueille des indices, formule des hypothèses et explore plusieurs pistes."],
["La Révélation","","Le personnage découvre ou comprend enfin ce qui s'est réellement passé."],
["Les Conséquences","","La vérité révélée change la situation, les relations entre les personnages ou la manière dont le personnage comprend ce qui s'est passé."]],
catastrophe:[
["Le Cadre","Où ? Quand ? Qui ? Descriptions.","Installer le lieu, le moment, les personnages et les éléments importants du décor."],
["L’Ancrage","",genericAnchor],["Le Premier problème","","Un premier problème survient et met le personnage en difficulté."],
["L’Aggravation","","Les tentatives pour résoudre le problème échouent ou provoquent de nouvelles difficultés. La situation devient de plus en plus difficile à maîtriser."],
["Le Point de rupture","","La situation atteint un point critique. Tout semble perdu ou le personnage doit faire face aux conséquences de ce qui s'est passé."],
["L’Issue","","La catastrophe arrive à son terme. Le personnage arrive à s'en sortir in extremis, ou pas."]],
dilemme:[
["Le Cadre","Où ? Quand ? Qui ? Descriptions.","Installer le lieu, le moment, les personnages et les éléments importants du décor."],
["L’Ancrage","","Une petite scène qui illustre l'attachement du personnage à deux choses (lieux, personnes, passions, ambitions...)."],
["Le Dilemme","","Le personnage doit choisir entre deux possibilités incompatibles. Chacune a des avantages, mais aussi un coût ou un risque."],
["L’Hésitation","","Le personnage hésite, cherche une solution pour éviter de choisir ou tente de concilier les deux possibilités."],
["La Décision","","Le personnage fait son choix et accepte le coût ou le risque qui l'accompagne."],
["Les Conséquences","","Le choix du personnage produit des conséquences et une nouvelle situation s'installe."]]};
const toolbox={
"👤 Personnage":["courageux / peureux","curieux","méfiant","naïf","orgueilleux","impulsif","solitaire","généreux","ambitieux","indécis","peur → courage","égoïsme → altruisme","solitude → confiance","naïveté → lucidité","arrogance → humilité","indécision → capacité de choisir","besoin de reconnaissance → confiance en soi","refus du changement → acceptation"],
"🎯 Enjeu":["une recherche","une enquête","une rivalité","une vengeance","une fuite","une poursuite","une mission","une compétition","une histoire d’amour contrariée","une quête","une survie","une personne à protéger","une faute à réparer","un secret à découvrir","une volonté de prouver sa valeur","une volonté de se libérer","une ascension sociale ou personnelle","un voyage dont le but se révèle progressivement"],
"⚡ Déclencheur":["une rencontre inattendue","une disparition","une mort","une perte","une trahison","une découverte","une lettre ou un message","un objet trouvé","un secret découvert","une accusation","un vol","une menace","une catastrophe","une erreur","un accident","une interdiction","une invitation","une proposition","une mission confiée au personnage","le retour d’une personne","l’arrivée dans un lieu inconnu","une intrusion du surnaturel"],
"🧩 Ingrédients":["un secret de famille","une rivalité entre frères, sœurs ou amis","une amitié improbable","un mentor","un amour interdit","un conflit entre générations","un héritage","un objet mystérieux","un objet précieux","une maison mystérieuse","un lieu interdit","une carte","un journal intime","de vieilles lettres","une société secrète","une conspiration"],
"🌍 Univers":["voyage","monde inconnu","île isolée","survie","surnaturel","voyage dans le temps","monde dystopique","monde futuriste","monde parallèle","guerre","catastrophe naturelle","époque historique","petite ville","grande ville","milieu rural","espace clos / huis clos"]};
let notes=Array(6).fill("");
function renderStructure(key){
const box=document.getElementById("structureBox"),data=structures[key]; box.innerHTML="";
for(let i=0;i<6;i++){const step=document.createElement("div");step.className="step";const info=document.createElement("div");info.className="step-info";
if(!data) info.innerHTML='<div class="step-number">'+(i+1)+'</div>';
else info.innerHTML='<div class="step-number">'+(i+1)+'</div><div class="step-title">'+data[i][0]+'</div>'+(data[i][1]?'<div class="step-desc"><strong>'+data[i][1]+'</strong></div>':"")+'<div class="step-desc">'+data[i][2]+'</div>';
const writing=document.createElement("div");writing.className="writing";const ta=document.createElement("textarea");ta.maxLength=400;ta.value=notes[i];ta.setAttribute("aria-label","Notes étape "+(i+1));const counter=document.createElement("div");counter.className="counter";
const update=()=>{notes[i]=ta.value;counter.textContent=ta.value.length+" / 400";};ta.addEventListener("input",update);update();writing.appendChild(ta);writing.appendChild(counter);step.appendChild(info);step.appendChild(writing);box.appendChild(step);}
}
function makeTools(){const root=document.getElementById("tools");root.innerHTML="";Object.entries(toolbox).forEach(([name,ideas])=>{const tool=document.createElement("div");tool.className="tool";const nameEl=document.createElement("div");nameEl.className="tool-name";nameEl.textContent=name;const idea=document.createElement("div");idea.className="idea";const btn=document.createElement("button");btn.textContent="🎲 Une idée";btn.addEventListener("click",()=>{idea.textContent=ideas[Math.floor(Math.random()*ideas.length)];btn.textContent="↻ Autre idée";});tool.appendChild(nameEl);tool.appendChild(idea);tool.appendChild(btn);root.appendChild(tool);});}
document.getElementById("structure").addEventListener("change",e=>{const key=e.target.value;const hasNotes=notes.some(n=>n.length>0);if(hasNotes&&key){if(!confirm("Changer de structure ?\n\nVos notes actuelles seront effacées.")){e.target.value="";return;}notes=Array(6).fill("");}renderStructure(key);});
document.getElementById("printBtn").addEventListener("click",()=>window.print());
document.getElementById("fullDraw").addEventListener("click",()=>document.querySelectorAll(".tool").forEach(tool=>tool.querySelector("button").click()));
renderStructure("");makeTools();
</script>
</body>
</html>
